<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postmortem samples</title>
<style>
  :root { --bg: #121212; --bar: #1c1c1c; --text: #eee; --text-2: #b5b5b5; --line: #333; --on: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', sans-serif; }
  .top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .top h1 { font-size: 0.9375rem; margin: 0; font-weight: 700; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: none; color: var(--text-2); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .tabs button[aria-pressed='true'] { background: var(--on); color: #111; border-color: var(--on); }
  .tabs button:hover { color: var(--text); }
  .sizes { margin-left: auto; display: flex; gap: 4px; }
  .sizes button { border: 1px solid var(--line); background: none; color: var(--text-2); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 0.8125rem; cursor: pointer; }
  .sizes button[aria-pressed='true'] { color: var(--text); border-color: var(--text-2); }
  .about { padding: 8px 16px; font-size: 0.875rem; color: var(--text-2); background: var(--bar); border-bottom: 1px solid var(--line); }
  .about b { color: var(--text); }
  .stage { height: calc(100% - 96px); display: flex; justify-content: center; background: #0a0a0a; }
  iframe { border: 0; width: 100%; height: 100%; background: #fff; transition: width .2s; }
  .stage.mobile iframe { width: 390px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
</style>
</head>
<body>
<div class="top">
  <h1>Postmortem · live samples</h1>
  <div class="tabs" id="tabs"></div>
  <div class="sizes"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Phone</button></div>
</div>
<div class="about" id="about"></div>
<div class="stage" id="stage"><iframe id="frame" title="Sample"></iframe></div>
<script>
const T = [
  ['t1-night-line.html', '1 · Night Line', 'A transit map at night. The game is a line: phases are fare zones, big moments are interchanges, and the current move is a station sign.'],
  ['t2-tab-board.html', '2 · Tab Board', 'An old software manual. The whole page takes the colour of the game phase, the tab rail on the right jumps between phases, and mistakes get a vermilion errata slip.'],
  ['t3-catalog.html', '3 · Catalog', 'Factory Records sleeve. Matte black, with one line per move; the taller the peak, the more that move gave away. The game also appears as a colour code.'],
  ['t4-grid.html', '4 · Grid Specimen', 'Crouwel grid poster. The construction grid is visible, and the current move is built cell by cell at huge size on a plane in the mark\'s colour.'],
  ['t5-training-file.html', '5 · Training File', 'A coach\'s card file. Each move is a typed index card with a stamped mark and a red pencil note; critical moments are filed as cards to revisit.'],
  ['t6-standard.html', '6 · The Standard', 'The familiar analysis board (green board, eval bar, review panel), done properly. The safe option.'],
];
let cur = 0;
const tabs = document.getElementById('tabs');
function show(i) {
  cur = i;
  tabs.innerHTML = T.map((t, k) => `<button data-i="${k}" aria-pressed="${k === i}">${t[1]}</button>`).join('');
  document.getElementById('frame').src = T[i][0];
  document.getElementById('about').innerHTML = `<b>${T[i][1].split(' · ')[1]}.</b> ${T[i][2]} Use ← → to step through the moves, F to flip, click moves, the graph, and the buttons. Real Stockfish review of Morphy's Opera Game.`;
  try { history.replaceState(null, '', '#' + (i + 1)); } catch {}
}
tabs.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) show(+b.dataset.i); });
document.querySelector('.sizes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-size]'); if (!b) return;
  document.querySelectorAll('.sizes button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  document.getElementById('stage').classList.toggle('mobile', b.dataset.size === 'mobile');
});
document.getElementById('frame').addEventListener('load', () => { try { document.getElementById('frame').contentWindow.focus(); } catch {} });
show(Math.max(0, Math.min(T.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
</body>
</html>
